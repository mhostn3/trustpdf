{# Single-page preview with prev/next buttons; the overlay content comes from the caller #}
<div id="previewWrapper" class="mt-3 d-none" data-tool-options>
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
    <span class="form-label mb-0">{{ preview_label }}</span>
    <span class="d-inline-flex align-items-center gap-2">
      <button type="button" class="btn btn-sm btn-outline-secondary" id="prevPageBtn" aria-label="Previous page"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
      <span id="previewPageLabel" class="small text-secondary">Page 1</span>
      <button type="button" class="btn btn-sm btn-outline-secondary" id="nextPageBtn" aria-label="Next page"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
    </span>
  </div>
  <div class="preview-stage">
    <canvas id="previewCanvas" aria-label="Page preview"></canvas>
    <div id="previewOverlay" class="preview-overlay">
      {{ overlay_html|safe }}
    </div>
  </div>
</div>
