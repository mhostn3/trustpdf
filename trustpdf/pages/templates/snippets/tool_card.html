{% load static %}
<div class="col-md-6 col-lg-3 my-2">
  <a href="{% url tool.url_name %}" class="text-decoration-none text-body">
    <div class="card h-100 shadow p-3 clickable-card">
      <div class="card-body text-center position-relative">
        <span class="badge text-bg-light position-absolute top-0 start-0 m-2">{{ tool.group }}</span>
        <img src="{% static tool.icon %}" alt="" width="150" height="150" class="mb-3 bg-white rounded-circle" loading="lazy">
        <h2 class="h3 card-title mb-3">{{ tool.title }}</h2>
        <p class="card-text mb-0">{{ tool.description }}</p>
      </div>
    </div>
  </a>
</div>
