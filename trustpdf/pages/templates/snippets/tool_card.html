{% load static %}
<div class="col-lg-3 my-1">
    <a href="{% url tool.url_name %}" class="text-decoration-none text-dark">
        <div class="card h-100 shadow p-3 clickable-card">
            <div class="card-body text-center position-relative">
                <span class="badge text-bg-light position-absolute top-0 start-0 m-2">{{ tool.group }}</span>
                <img src="{% static tool.icon %}" alt="Merge PDF Icon" class="mb-3" style="max-height: 150px;">
                <h3 class="card-title mb-3">{{ tool.title }}</h3>
                <p class="card-text mb-0">{{ tool.description }}</p>
            </div>
        </div>
    </a>
</div>
