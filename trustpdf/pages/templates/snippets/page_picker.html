{# Thumbnail grid used by split / rotate / remove (click to select) and reorder (drag) #}
<div id="pageGridWrapper" class="mt-3 d-none" data-tool-options>
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
    <span class="form-label mb-0">{{ picker_label|default:"Click pages to select them" }}</span>
    {% if picker_select_buttons %}
      <span>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="selectAllBtn">Select all</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="selectNoneBtn">Clear</button>
      </span>
    {% endif %}
  </div>
  <ul id="pageGrid" class="page-grid" aria-label="Pages"></ul>
</div>
