<div class="row">
  <div class="col col-lg-7 mx-auto">

    <div class="text-center mb-4">
      <h1 class="display-1 fw-bold">{{ error_code }}</h1>
      <h2 class="display-6">{{ error_title }}</h2>

      <p class="lead text-body-secondary">
        {{ error_message }}
      </p>
    </div>

    <div class="card shadow-sm p-4 my-1 text-center">

      {% if error_privacy_note %}
        <p class="text-body-secondary">
          {{ error_privacy_note }}
        </p>
      {% endif %}

      <div class="d-flex justify-content-center gap-2 flex-wrap mt-3">
        <a href="{% url 'pages:index' %}" class="btn btn-dark">
          Go to homepage
        </a>
      </div>

      <hr class="my-4">

      <p class="text-body-secondary small mb-0">
        If you think this is a mistake or the problem continues, please contact us at
        <a href="mailto:{{ contact_email }}?subject=TrustPDF%20-%20{{ error_code }}%20Error"
           class="text-decoration-none link-secondary fw-semibold">
          {{ contact_email }}
        </a>.
      </p>

    </div>

  </div>
</div>
